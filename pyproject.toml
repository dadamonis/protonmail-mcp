[project]
name = "protonmail-mcp"
version = "0.1.0"
description = "MCP server for ProtonMail via ProtonMail Bridge — read, search, send, organise, and label email over Bridge's local IMAP/SMTP endpoints."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Duke (dadamonis)" }]
keywords = ["mcp", "protonmail", "proton", "bridge", "email", "imap", "smtp"]
dependencies = [
    "imap-tools>=1.15.0",
    "mcp>=2.1",
    "pydantic>=2.7",
]

[project.scripts]
protonmail-mcp = "protonmail_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protonmail_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
